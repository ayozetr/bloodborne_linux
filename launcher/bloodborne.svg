<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Bloodborne port icon: blood moon over Yharnam's spires (original artwork, GPL-2.0-or-later) -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3a0d0b"/>
      <stop offset="0.55" stop-color="#170807"/>
      <stop offset="1" stop-color="#070404"/>
    </radialGradient>
    <radialGradient id="moon" cx="46%" cy="42%" r="55%">
      <stop offset="0" stop-color="#e2362a"/>
      <stop offset="0.6" stop-color="#b3191a"/>
      <stop offset="1" stop-color="#6e0b0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#c0201c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c0201c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b779"/>
      <stop offset="0.5" stop-color="#8a6a36"/>
      <stop offset="1" stop-color="#c9a15e"/>
    </linearGradient>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="170"/></clipPath>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="170" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="400" r="330" fill="url(#glow)"/>
    <circle cx="512" cy="400" r="250" fill="url(#moon)"/>
    <!-- city silhouette -->
    <g fill="#050303">
      <!-- central cathedral spire -->
      <polygon points="512,150 528,300 540,300 552,470 472,470 484,300 496,300"/>
      <rect x="500" y="118" width="24" height="40"/>
      <rect x="507" y="96" width="10" height="34"/>
      <rect x="494" y="106" width="36" height="8"/>
      <polygon points="440,470 584,470 600,1000 424,1000"/>
      <!-- flanking towers -->
      <polygon points="408,330 420,430 432,430 446,560 370,560 384,430 396,430"/>
      <polygon points="616,330 628,430 640,430 654,560 578,560 592,430 604,430"/>
      <rect x="360" y="550" width="100" height="450"/>
      <rect x="564" y="550" width="100" height="450"/>
      <!-- outer spires -->
      <polygon points="300,470 312,560 322,560 334,660 266,660 278,560 288,560"/>
      <polygon points="724,470 736,560 746,560 758,660 690,660 702,560 712,560"/>
      <rect x="250" y="650" width="100" height="350"/>
      <rect x="674" y="650" width="100" height="350"/>
      <polygon points="190,600 200,680 214,680 224,760 160,760 170,680 180,680"/>
      <polygon points="834,600 844,680 858,680 868,760 804,760 814,680 824,680"/>
      <rect x="40" y="750" width="230" height="250"/>
      <rect x="754" y="750" width="230" height="250"/>
      <polygon points="40,820 120,700 150,760 200,740 270,800 270,1000 40,1000"/>
      <polygon points="984,820 904,700 874,760 824,740 754,800 754,1000 984,1000"/>
    </g>
    <!-- lit windows -->
    <g fill="#d9922f" opacity="0.85">
      <rect x="505" y="560" width="14" height="40" rx="7"/>
      <rect x="388" y="620" width="10" height="28" rx="5"/>
      <rect x="626" y="620" width="10" height="28" rx="5"/>
      <rect x="292" y="720" width="10" height="24" rx="5"/>
      <rect x="722" y="720" width="10" height="24" rx="5"/>
    </g>
  </g>
  <rect x="40" y="40" width="944" height="944" rx="170" fill="none" stroke="url(#frame)" stroke-width="22"/>
</svg>
