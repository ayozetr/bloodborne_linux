# The Docker images for a group's own co-op server (docs/SERVER.md), published to GitHub's
# container registry, where they show in the repository's Packages:
#   ghcr.io/ayozetr/bbport-shadnet      tools/shadnet-server (shadNet, Wozzardman/shadnet-p2p)
#   ghcr.io/ayozetr/bbport-bbsc-server  tools/bbsc-server (BBSC's game server, scripts/bbsc_gameserver)
# Built when what goes into them changes on main, and by hand from the Actions tab. Each push has
# the tag `latest` and the commit's short hash.
name: Server images

on:
  push:
    branches: [main]
    paths:
      - tools/shadnet-server/**
      - tools/bbsc-server/**
      - scripts/bbsc_gameserver/**
      - .github/workflows/server-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-images
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bbport-shadnet
            context: tools/shadnet-server
            title: bbport shadNet server
            description: A private shadNet server for Bloodborne co-op with bbport (Wozzardman/shadnet-p2p)
            fresh: false
          - name: bbport-bbsc-server
            context: tools/bbsc-server
            title: bbport BBSC game server
            description: "BBSC's game server for seamless co-op next to a shadNet server: messages, bloodstains, BBSC's relay"
            # It clones scripts/bbsc_gameserver from main while it builds: a cached layer would keep
            # an older one. Small, so built afresh every time.
            fresh: true
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
          # org.opencontainers.image.source (the repository) links the package to it.
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/SERVER.md
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          no-cache: ${{ matrix.fresh }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
